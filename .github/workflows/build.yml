name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka
      - name: Build (Nuitka standalone)
        run: powershell -ExecutionPolicy Bypass -File scripts/build_nuitka.ps1
      - name: Package (zip)
        shell: pwsh
        run: Compress-Archive -Path build/run.dist/* -DestinationPath status-report-app-windows.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-report-app-windows
          path: status-report-app-windows.zip
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: status-report-app-windows.zip
